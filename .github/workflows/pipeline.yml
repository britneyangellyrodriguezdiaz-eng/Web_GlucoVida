name: Pipeline GlucoVida

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  verificar:
    name: Verificar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura de archivos
        run: |
          test -f index.html
          test -d pages
          test -d css

      - name: Finalizar pipeline
        run: echo "Verificaciones de GlucoVida completadas con éxito" 